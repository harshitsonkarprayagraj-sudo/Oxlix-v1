name: Extract OXLIX ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o "oxlix-v1-fix-batch.zip" -d extracted
          cp -r extracted/*/* . 2>/dev/null || cp -r extracted/* .
          rm -rf extracted
          rm -f "oxlix-v1-fix-batch.zip"

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Extract OXLIX project files"
          git push
