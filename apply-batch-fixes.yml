name: Apply OXLIX Batch Fixes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract batch fixes
        run: |
          unzip -o "oxlix-v1-batch-fixes.zip" -d batch_fixes

          if [ -d "batch_fixes" ]; then
            find batch_fixes -type f ! -path "*/.git/*" | while read file; do
              target="${file#batch_fixes/}"

              if [ "$target" != "oxlix-v1-batch-fixes.zip" ]; then
                mkdir -p "$(dirname "$target")"
                cp "$file" "$target"
              fi
            done
          fi

          rm -rf batch_fixes
          rm -f "oxlix-v1-batch-fixes.zip"

      - name: Show changed files
        run: |
          git status --short

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Apply OXLIX V1 batch fixes"
            git push
          fi
